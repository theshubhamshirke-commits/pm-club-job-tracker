name: Manual PM tracker publication check

on:
  push:
    branches: ['codex/manual-refresh-2026-10-26']
    paths: ['.github/workflows/manual-verification.yml']

permissions:
  contents: read
  pages: write

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Test the daily Pages rebuild request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status
